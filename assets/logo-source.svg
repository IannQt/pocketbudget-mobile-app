<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="#1E2B22"/>

  <!-- Subtle depth accent -->
  <circle cx="512" cy="512" r="360" fill="#243A2C"/>

  <!-- Wallet body -->
  <g>
    <rect x="272" y="392" width="480" height="330" rx="48" fill="#EEF1E7"/>
    <!-- Wallet flap shadow strip -->
    <rect x="272" y="392" width="480" height="92" rx="46" fill="#D5D9C9"/>
    <!-- Front pocket line -->
    <rect x="272" y="392" width="480" height="330" rx="48" fill="none" stroke="#1E2B22" stroke-opacity="0.06" stroke-width="4"/>
  </g>

  <!-- Coin / clasp -->
  <circle cx="652" cy="560" r="58" fill="#A67C3D"/>
  <circle cx="652" cy="560" r="58" fill="none" stroke="#8A6531" stroke-width="6"/>

